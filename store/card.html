<!doctype html>
<!-- Source of docs/images/card.png, the picture a link to the website shows when shared
     (Facebook, Messenger, Slack, ...: og:image), 1200x630. Rendered with headless Chrome:
     google-chrome --headless=new --hide-scrollbars --window-size=1200,630 \
       --screenshot=docs/images/card.png store/card.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>arkivet2fs card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f4ecdc; }
  .card { box-sizing: border-box; height: 630px; padding: 0 80px; display: flex; align-items: center; gap: 56px;
    font-family: Inter, system-ui, sans-serif; border-bottom: 18px solid #4a88c4; }
  .text { display: flex; flex-direction: column; gap: 22px; }
  .name { font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 64px; line-height: 1.05;
    color: #2e547a; letter-spacing: -0.01em; }
  .tag { font-size: 32px; line-height: 1.3; color: #2e547a; }
  .small { font-size: 24px; color: #56697a; }
  .small b { color: #b0621f; font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <svg width="260" height="260" viewBox="0 0 128 128" aria-hidden="true" style="flex: none">
    <rect width="128" height="128" rx="28" fill="#4a88c4"/>
    <path d="M64 84 V52 M38 52 H90 M38 52 V44 M90 52 V44" fill="none" stroke="#f4ecdc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 86 C30 79 48 79 61 86 V108 C48 101 30 101 16 108 Z M67 86 C80 79 98 79 112 86 V108 C98 101 80 101 67 108 Z" fill="#f4ecdc"/>
    <path d="M24 93 C34 89 44 89 54 93 M24 100 C34 96 44 96 54 100 M74 93 C84 89 94 89 104 93 M74 100 C84 96 94 96 104 100" fill="none" stroke="#2e547a" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="38" cy="34" r="11" fill="#f4ecdc"/>
    <circle cx="90" cy="34" r="11" fill="#f4ecdc"/>
    <circle cx="64" cy="68" r="10" fill="#d0843f" stroke="#2e547a" stroke-width="4"/>
  </svg>
  <div class="text">
    <div class="name">DigitalArkivet to FamilySearch</div>
    <div class="tag">Find your Norwegian ancestors in Digitalarkivet and cite them in your FamilySearch tree.</div>
    <div class="small"><b>Free</b> genealogy extension · Chrome, Brave, Opera, Firefox</div>
  </div>
</div>
</body>
</html>
