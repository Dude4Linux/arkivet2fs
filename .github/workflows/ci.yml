# The tests, a syntax check of every script and a build of the packages, on each push
# and pull request.
# Actions are pinned to commit SHAs (the tag in the comment); the token can only read.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Syntax of every script
        run: |
          git ls-files -z '*.js' '*.mjs' | xargs -0 -n1 node --check
          git ls-files -z '*.sh' tools/release | xargs -0 -n1 sh -n
          git ls-files -z '*.sh' tools/release | xargs -0 shellcheck -s sh

      # The fixtures are sanitized DA pages: their permanent IDs are made up (pd99...).
      # A real one (also inside an encoded address, %2Fpd0000...) means a page went in
      # without tests/sanitize.js.
      - name: No real DA permanent IDs in the fixtures
        run: |
          if git grep -nP '(?<![0-9])[a-z]{2}(?!99)[0-9]{14,}(?![0-9])' -- tests/fixtures; then
            echo "::error::real DA permanent IDs in tests/fixtures: run tests/sanitize.js"
            exit 1
          fi

      - run: npm test

      # Every file must be shipped or excluded, and the shipped ones must refer to each
      # other completely (tools/build.mjs); the package is kept for a week to try out.
      - name: Build the packages
        run: node tools/build.mjs --out dist

      # Mozilla's checks (addons-linter, as AMO runs them) on the package as built: one
      # package for Chromium and Firefox. Warnings are shown, errors fail the run.
      - name: Lint the package for Firefox
        run: |
          mkdir dist/lint
          unzip -q dist/*.zip -d dist/lint
          npx web-ext lint --source-dir dist/lint/arkivet2fs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/*.zip
          retention-days: 7
